services:
  # ── PostgreSQL ──
  db:
    image: postgres:18
    container_name: pinch_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hydrogen_pinch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Бэкенд (FastAPI) ──
  pinch-api:
    build: ./backend
    container_name: pinch_optimizer
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: hydrogen_pinch
      DB_USER: postgres
      DB_PASSWORD: 1234
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/pinch/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    # Command was removed as it will be specified in the Dockerfile
    # Volumes removed so it uses the built multistage image code

  # ── Фронтенд (Angular + Nginx) ──
  frontend:
    build: ./frontend
    container_name: pinch_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      pinch-api:
        condition: service_healthy

volumes:
  pgdata:
