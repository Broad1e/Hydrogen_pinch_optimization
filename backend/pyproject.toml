[tool.poetry]
name = "hydrogen-pinch-backend"
version = "2.0.0"
description = "Hydrogen Pinch Optimizer API"
authors = ["Team <team@example.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = "^0.30.1"
sqlalchemy = "^2.0.31"
psycopg2-binary = "^2.9.9"
scipy = "^1.13.1"
pydantic = "^2.8.0"
pydantic-settings = "^2.3.4"
loguru = "^0.7.2"
python-dotenv = "^1.0.1"
networkx = "<=3.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
httpx = "^0.27.0"
ruff = "^0.4.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "C90", "D"]
ignore = ["D100", "D104", "D106"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
addopts = "-v --disable-warnings"
testpaths = ["tests"]
pythonpath = ["src"]
